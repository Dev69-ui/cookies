<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram / Facebook Capture</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #12141a; color: #e8e8e8; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 16px;
  }
  h1 { font-size: 24px; margin-bottom: 6px; }
  p.sub { color: #9aa4b2; margin-bottom: 28px; text-align: center; }
  button {
    font-size: 16px; font-weight: 600; color: #fff; background: #8957e5; border: none; border-radius: 10px;
    padding: 14px 28px; cursor: pointer; transition: transform .1s, opacity .2s;
  }
  button:hover { transform: translateY(-2px); }
  button:disabled { opacity: .45; cursor: wait; }
  .status { color: #9aa4b2; margin-bottom: 20px; min-height: 22px; }
  .results { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%; }
  .result-box { flex: 1 1 460px; max-width: 560px; min-width: 320px; }
  .result-box h2 { font-size: 14px; color: #9aa4b2; margin-bottom: 8px; }
  img { width: 100%; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.5); display: none; }
</style>
</head>
<body>
  <h1>Instagram / Facebook Capture</h1>
  <p class="sub">Runs record.js on this PC — captures both header screenshots (Instagram then Facebook) from your own browser.</p>
  <button id="btn" onclick="runLocal()">Capture with your browser (record.js)</button>
  <div class="status" id="status"></div>
  <div class="results">
    <div class="result-box">
      <h2>Instagram — instagram/?__a=1</h2>
      <img id="img-0" alt="instagram capture">
    </div>
    <div class="result-box">
      <h2>Facebook — facebook/?__a=1</h2>
      <img id="img-1" alt="facebook capture">
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const SITES = ['instagram', 'facebook'];
    const COMPANION = 'http://127.0.0.1:9876';

    const runLocal = async () => {
      $('btn').disabled = true;
      $('img-0').style.display = 'none';
      $('img-1').style.display = 'none';
      $('status').textContent = 'Checking local record.js companion…';
      try {
        const ping = await fetch(COMPANION + '/ping', { cache: 'no-store' });
        if (!ping.ok) throw new Error('ping failed');
      } catch (e) {
        $('status').textContent =
          'No local record.js service on this PC. Run  node companion.js  in your cookies folder, then click again.';
        $('btn').disabled = false;
        return;
      }
      $('status').textContent = 'Running record.js in your browser (Instagram then Facebook)… keep this tab open.';
      try {
        const res = await fetch(COMPANION + '/run?site=both', { cache: 'no-store' });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'HTTP ' + res.status);
        for (const site of SITES) {
          if (data.images && data.images[site]) {
            $('img-' + SITES.indexOf(site)).src = data.images[site];
            $('img-' + SITES.indexOf(site)).style.display = 'block';
          }
        }
        $('status').textContent = 'Done — screenshots from YOUR browser (real login) captured below.';
      } catch (e) {
        $('status').textContent = 'Error: ' + e.message;
      } finally {
        $('btn').disabled = false;
      }
    };
  </script>
</body>
</html>
